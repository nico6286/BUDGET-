<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Couple</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --error-color: #cf6679;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            color: #121212;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background-color: #9a67ea;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--secondary-color);
            color: var(--secondary-color);
            margin-top: 10px;
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            min-height: 24px;
        }

        /* Liste des dépenses */
        .depense-item {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .depense-item:last-child {
            border-bottom: none;
        }

        .depense-info {
            display: flex;
            flex-direction: column;
        }

        .depense-titre {
            font-weight: bold;
        }

        .depense-meta {
            font-size: 0.8rem;
            color: #888;
        }

        .depense-montant {
            font-weight: bold;
            color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Budget Couple</h1>
        
        <div class="card">
            <form id="budgetForm">
                <div class="form-group">
                    <label for="titre">Intitulé de la dépense</label>
                    <input type="text" id="titre" required placeholder="Ex: Courses Carrefour">
                </div>
                
                <div class="form-group">
                    <label for="montant">Montant (€)</label>
                    <input type="number" id="montant" step="0.01" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="payeur">Qui a payé ?</label>
                    <select id="payeur" required>
                        <option value="Partenaire 1">Partenaire 1</option>
                        <option value="Partenaire 2">Partenaire 2</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="noSplit">
                    <label for="noSplit">Ne pas diviser (Dépense perso)</label>
                </div>

                <button type="submit">Ajouter la dépense</button>
            </form>
            <div id="statusMsg" class="status-msg"></div>
        </div>

        <h2>Dernières Dépenses</h2>
        <div class="card" id="historiqueCard">
            <button class="btn-secondary" onclick="chargerDepenses()">Rafraîchir l'historique</button>
            <div id="listeDepenses" style="margin-top: 15px;">
                </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ETAPE 4 : COLLER VOTRE URL DE DEPLOIEMENT ICI
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2DVPU1se-fIUiNXFO2DMuxxxFv6qpFCE8AbmBldh6-PRhAHD2s6d-35JVJiCnWN8t/exec";

        // Générateur d'ID unique simple
        const generateID = () => 'ID-' + Math.random().toString(36).substr(2, 9).toUpperCase();

        // Envoi des données au Google Sheet
        document.getElementById('budgetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const msgDiv = document.getElementById('statusMsg');
            msgDiv.style.color = 'var(--secondary-color)';
            msgDiv.innerText = "Envoi en cours...";

            const payload = {
                action: "addData",
                id: generateID(),
                titre: document.getElementById('titre').value,
                montant: parseFloat(document.getElementById('montant').value),
                payeur: document.getElementById('payeur').value,
                date: new Date().toLocaleDateString('fr-FR'),
                statut: "En attente",
                noSplit: document.getElementById('noSplit').checked ? "Oui" : "Non"
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    msgDiv.innerText = "Dépense enregistrée !";
                    document.getElementById('budgetForm').reset();
                    chargerDepenses(); // Met à jour la liste
                } else {
                    msgDiv.style.color = 'var(--error-color)';
                    msgDiv.innerText = "Erreur : " + data.error;
                }
            })
            .catch(error => {
                msgDiv.style.color = 'var(--error-color)';
                msgDiv.innerText = "Erreur de connexion.";
                console.error(error);
            });
        });

        // Récupération des données depuis le Google Sheet
        function chargerDepenses() {
            const liste = document.getElementById('listeDepenses');
            liste.innerHTML = "<p style='text-align:center; color:#888;'>Chargement...</p>";

            fetch(SCRIPT_URL + "?action=getData", { // Utilisation d'un paramètre GET pour l'action de lecture globale
                method: "POST",
                body: JSON.stringify({ action: "getData" })
            })
            .then(response => response.json())
            .then(res => {
                if(res.result === "success" && res.data.length > 0) {
                    liste.innerHTML = "";
                    // Afficher les 10 dernières dépenses (ordre inverse)
                    const dernièresDepenses = res.data.reverse().slice(0, 10);
                    
                    dernièresDepenses.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'depense-item';
                        div.innerHTML = `
                            <div class="depense-info">
                                <span class="depense-titre">${item.Titre}</span>
                                <span class="depense-meta">${item.Date} • Par ${item.Payeur} ${item.NoSplit === "Oui" ? '(Perso)' : ''}</span>
                            </div>
                            <div class="depense-montant">${item.Montant} €</div>
                        `;
                        liste.appendChild(div);
                    });
                } else {
                    liste.innerHTML = "<p style='text-align:center; color:#888;'>Aucune dépense trouvée.</p>";
                }
            })
            .catch(error => {
                liste.innerHTML = "<p style='text-align:center; color:var(--error-color);'>Erreur de chargement.</p>";
                console.error(error);
            });
        }

        // Charger les données au démarrage de l'application
        window.onload = chargerDepenses;
    </script>
</body>
</html>
