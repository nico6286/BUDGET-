<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mon Budget</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
        button:hover { background-color: #0056b3; }
        .btn-flash { background-color: #28a745; }
        .btn-flash:hover { background-color: #218838; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gestion Budget</h2>
    
    <button type="button" class="btn-flash" onclick="genererFacturesFixes()">⚡ Générer Factures Fixes (Début de Mois)</button>
    
    <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">

    <form id="budgetForm">
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>Libellé / Catégorie</label>
            <input type="text" id="nom" placeholder="Ex: Courses, Essence..." required>
        </div>
        <div class="form-group">
            <label>Montant (€)</label>
            <input type="number" step="0.01" id="montant" required>
        </div>
        <div class="form-group">
            <label>Type</label>
            <select id="type">
                <option value="Débit">Débit</option>
                <option value="Crédit">Crédit</option>
            </select>
        </div>
        <button type="submit">Enregistrer la ligne</button>
    </form>
    
    <div id="status"></div>
</div>

<script>
    // METS ICI L'URL DE TON DEPLOIEMENT GOOGLE APPS SCRIPT (APPLICATION WEB)
    const WEB_APP_URL = "https://script.google.com/macros/s/XXXXX/exec";

    // Mettre la date du jour par défaut dans le formulaire
    document.getElementById('date').valueAsDate = new Date();

    // Envoi classique d'un formulaire (Texte pur en JSON)
    document.getElementById('budgetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const data = {
            date: document.getElementById('date').value,
            nom: document.getElementById('nom').value,
            montant: document.getElementById('montant').value,
            type: document.getElementById('type').value
        };

        envoyerAGoogle(data);
    });

    // FONCTION FLASH : Rempli et envoie d'un coup tes lignes fixes
    function genererFacturesFixes() {
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "blue";
        statusDiv.innerText = "Génération des factures fixes en cours...";

        const dateAujourdhui = new Date().toISOString().split('T')[0];

        // Liste de tes factures fixes (Modifie les noms et montants ici !)
        const factures = [
            { date: dateAujourdhui, nom: "Facture Électricité", montant: "85.00", type: "Débit" },
            { date: dateAujourdhui, nom: "Abonnement Internet", montant: "39.99", type: "Débit" },
            { date: dateAujourdhui, nom: "Assurance", montant: "45.50", type: "Débit" }
        ];

        // On envoie les lignes une par une de manière propre
        let promesses = factures.map(facture => {
            return fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Crucial pour éviter les blocages sur GitHub Pages
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(facture)
            });
        });

        Promise.all(promesses)
            .then(() => {
                statusDiv.style.color = "green";
                statusDiv.innerText = "✅ Toutes les factures fixes ont été enregistrées !";
            })
            .catch(err => {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Erreur lors de l'envoi flash.";
                console.error(err);
            });
    }

    // Fonction standard d'envoi
    function envoyerAGoogle(data) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "blue";
        statusDiv.innerText = "Enregistrement en cours...";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
        .then(() => {
            statusDiv.style.color = "green";
            statusDiv.innerText = "✅ Enregistré avec succès dans le Sheet !";
            document.getElementById('nom').value = '';
            document.getElementById('montant').value = '';
        })
        .catch(err => {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Erreur de connexion.";
            console.error(err);
        });
    }
</script>

</body>
</html>
