<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Couple</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --error-color: #cf6679;
            --border-color: #333333;
            --accent-orange: #ffb74d;
            --success-color: #1b5e20;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 500px; }
        h1, h2 { text-align: center; color: var(--primary-color); margin-top: 10px; }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .balance-box {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            background-color: #1a237e;
            border: 1px solid #303f9f;
            color: #fff;
            margin-bottom: 10px;
        }

        .virement-status {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: var(--accent-orange);
            font-weight: bold;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
        input, select {
            width: 100%; padding: 12px; background-color: #2c2c2c;
            border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--text-color); font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary-color); }

        .checkbox-group {
            display: flex; align-items: center; gap: 10px; user-select: none; margin-top: 10px;
        }
        .checkbox-group input { width: auto; transform: scale(1.3); cursor: pointer; }

        button {
            width: 100%; padding: 14px; background-color: var(--primary-color);
            border: none; border-radius: 6px; color: #121212;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        button:active { background-color: #9a67ea; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--secondary-color); color: var(--secondary-color); margin-top: 10px; }
        .btn-success { background-color: var(--success-color); color: white; margin-top: 5px; border: 1px solid #2e7d32; }
        .btn-cancel { background-color: #333; color: #fff; margin-top: 8px; }
        
        .btn-quick { 
            width: 100%; background-color: #263238; border: 1px dashed var(--accent-orange); 
            color: var(--accent-orange); padding: 10px; font-size: 0.9rem; 
            margin-bottom: 15px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        .status-msg { text-align: center; font-weight: bold; margin-top: 10px; min-height: 24px; }

        .depense-item {
            border-bottom: 1px solid var(--border-color); padding: 14px 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .depense-item:last-child { border-bottom: none; }
        .depense-info { display: flex; flex-direction: column; max-width: 70%; }
        .depense-titre { font-weight: bold; font-size: 1.05rem; }
        .depense-meta { font-size: 0.8rem; color: #888; margin-top: 4px; }
        
        .badge-facture {
            background-color: #311b92; color: #b388ff; padding: 2px 6px;
            border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 5px;
        }

        .depense-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .depense-montant { font-weight: bold; color: var(--secondary-color); font-size: 1.1rem; }
        
        .actions-links { font-size: 0.8rem; }
        .actions-links span { cursor: pointer; margin-left: 10px; text-decoration: underline; }
        .edit-link { color: var(--accent-orange); }
        .delete-link { color: var(--error-color); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Budget Couple</h1>
        
        <div class="card" style="padding: 15px; margin-bottom: 15px;">
            <label for="filtreMois" style="font-weight: bold; color: var(--primary-color);">Mois à calculer / consulter :</label>
            <input type="text" id="filtreMois" placeholder="Ex: 05/2026" style="text-align: center; font-weight: bold; font-size: 1.1rem;" maxlength="7">
        </div>

        <div id="balanceBox" class="balance-box">Chargement des données...</div>
        <div id="virementStatus" class="virement-status"></div>
        <button id="btnMarquerFait" class="btn-success" style="display:none;" onclick="marquerVirementFait()">Marquer le virement comme FAIT</button>
        
        <div style="margin-bottom: 20px;"></div>

        <div class="card">
            <h3 id="formTitle" style="margin-top:0; margin-bottom: 10px; color: var(--secondary-color);">Ajouter une ligne</h3>
            
            <button type="button" class="btn-quick" onclick="preRemplirFacture()">⚡ Pré-remplir Facture Mensuelle</button>

            <form id="budgetForm">
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="titre">Intitulé de la dépense</label>
                    <input type="text" id="titre" required placeholder="Ex: Facture, Courses...">
                </div>
                
                <div class="form-group">
                    <label for="montant">Montant (€)</label>
                    <input type="number" id="montant" step="0.01" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="dateMois">Mois de la dépense (MM/AAAA)</label>
                    <input type="text" id="dateMois" required placeholder="Ex: 05/2026" maxlength="7">
                </div>
                
                <div class="form-group">
                    <label for="payeur">Qui a payé / Qui possède la facture ?</label>
                    <select id="payeur" required>
                        <option value="Nicolas">Nicolas</option>
                        <option value="Pauline">Pauline</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="isFacture">
                    <label for="isFacture"><strong>Facture fixe (100% à charge du conjoint)</strong></label>
                </div>

                <button type="submit" id="submitBtn" style="margin-top: 15px;">Enregistrer</button>
                <button type="button" id="cancelEditBtn" class="btn-cancel" style="display: none;" onclick="resetForm()">Annuler</button>
            </form>
            <div id="statusMsg" class="status-msg"></div>
        </div>

        <h2>Dépenses du mois sélectionné</h2>
        <div class="card">
            <button class="btn-secondary" onclick="chargerDepenses()">Rafraîchir les données</button>
            <div id="listeDepenses" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCvAPEDAe6UUfJDWF38NWWjP5bTMMRBAxgxPrjotUfvMH3xVRz2zpzXAVbsKDOUYkf/exec";
        let localData = [];

        const generateID = () => 'ID-' + Math.random().toString(36).substr(2, 9).toUpperCase();

        // Événement de changement de mois manuel
        document.getElementById('filtreMois').addEventListener('change', chargerDepenses);

        // Fonction de pré-remplissage
        function preRemplirFacture() {
            document.getElementById('titre').value = "Facture";
            document.getElementById('montant').value = "959.21";
            document.getElementById('dateMois').value = document.getElementById('filtreMois').value;
            document.getElementById('payeur').value = "Pauline";
            document.getElementById('isFacture').checked = true;
            
            const mInput = document.getElementById('montant');
            mInput.focus();
            mInput.select();
        }

        document.getElementById('budgetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('statusMsg');
            const editId = document.getElementById('editId').value;
            
            msgDiv.style.color = 'var(--secondary-color)';
            msgDiv.innerText = "Synchronisation avec Google Sheets...";

            const payload = {
                id: editId ? editId : generateID(),
                titre: document.getElementById('titre').value,
                montant: parseFloat(document.getElementById('montant').value),
                payeur: document.getElementById('payeur').value,
                date: document.getElementById('dateMois').value,
                noSplit: document.getElementById('isFacture').checked ? "Oui" : "Non"
            };

            if (editId) {
                payload.action = "updateData";
            } else {
                payload.action = "addData";
                payload.statut = "En attente";
            }

            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    msgDiv.innerText = "Donnée enregistrée avec succès !";
                    resetForm();
                    chargerDepenses();
                } else {
                    msgDiv.style.color = 'var(--error-color)';
                    msgDiv.innerText = "Erreur : " + data.error;
                }
            })
            .catch(error => {
                msgDiv.style.color = 'var(--error-color)';
                msgDiv.innerText = "Erreur réseau.";
                console.error(error);
            });
        });

        function chargerDepenses() {
            const liste = document.getElementById('listeDepenses');
            const cibleMois = document.getElementById('filtreMois').value.trim();
            liste.innerHTML = "<p style='text-align:center; color:#888;'>Chargement...</p>";

            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getData" }) })
            .then(response => response.json())
            .then(res => {
                if(res.result === "success" && res.data.length > 0) {
                    
                    localData = res.data.map(item => {
                        const valeurs = Array.isArray(item) ? item : Object.values(item);
                        return {
                            id: valeurs[0] ? valeurs[0].toString() : "",
                            titre: valeurs[1] ? valeurs[1].toString() : "Sans titre",
                            montant: parseFloat(valeurs[2] || 0),
                            payeur: valeurs[3] ? valeurs[3].toString().trim() : "Inconnu",
                            date: valeurs[4] ? valeurs[4].toString().trim() : "",
                            statut: valeurs[5] ? valeurs[5].toString().trim() : "En attente",
                            nosplit: valeurs[6] ? valeurs[6].toString().trim() : "Non"
                        };
                    });

                    const dataDuMois = localData.filter(item => item.date === cibleMois);
                    liste.innerHTML = "";
                    
                    let virementDuMois = 0;
                    let virementEstFait = false;
                    let dateVirementFait = "";

                    dataDuMois.forEach(item => {
                        if(item.statut.startsWith("Virement fait le")) {
                            virementEstFait = true;
                            dateVirementFait = item.statut;
                        }

                        if (item.nosplit === "Oui" || item.nosplit === "oui") {
                            if (item.payeur === "Pauline") virementDuMois += item.montant;
                            if (item.payeur === "Nicolas") virementDuMois -= item.montant;
                        } else {
                            if (item.payeur === "Pauline") virementDuMois += (item.montant / 2);
                            if (item.payeur === "Nicolas") virementDuMois -= (item.montant / 2);
                        }
                    });

                    calculerVirementVisualisation(virementDuMois, virementEstFait, dateVirementFait);

                    if(dataDuMois.length === 0) {
                        liste.innerHTML = "<p style='text-align:center; color:#888;'>Aucune entrée pour ce mois.</p>";
                        return;
                    }

                    [...dataDuMois].reverse().forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'depense-item';
                        div.innerHTML = `
                            <div class="depense-info">
                                <span class="depense-titre">
                                    ${item.titre} 
                                    ${(item.nosplit === "Oui" || item.nosplit === "oui") ? '<span class="badge-facture">Facture 100%</span>' : ''}
                                </span>
                                <span class="depense-meta">Mois : ${item.date} • Payé par <strong>${item.payeur}</strong></span>
                            </div>
                            <div class="depense-right">
                                <span class="depense-montant">${item.montant.toFixed(2)} €</span>
                                <div class="actions-links">
                                    <span class="edit-link" onclick="preparerEdition('${item.id}')">Modifier</span>
                                    <span class="delete-link" onclick="supprimerDepense('${item.id}')">Suppr.</span>
                                </div>
                            </div>
                        `;
                        liste.appendChild(div);
                    });
                } else {
                    liste.innerHTML = "<p style='text-align:center; color:#888;'>Aucune donnée trouvée.</p>";
                }
            })
            .catch(error => {
                liste.innerHTML = "<p style='text-align:center; color:var(--error-color);'>Erreur de chargement.</p>";
                console.error(error);
            });
        }

        function calculerVirementVisualisation(totalVirement, estFait, dateTexte) {
            const box = document.getElementById('balanceBox');
            const statusDiv = document.getElementById('virementStatus');
            const btn = document.getElementById('btnMarquerFait');

            if (totalVirement === 0) {
                box.style.backgroundColor = "#1b5e20";
                box.innerText = "Équilibre parfait pour ce mois !";
                btn.style.display = "none";
                statusDiv.innerText = "";
            } else if (totalVirement > 0) {
                box.style.backgroundColor = "#e65100";
                box.innerText = `Virement dû : Nicolas doit ${totalVirement.toFixed(2)} € à Pauline`;
                if(estFait) {
                    statusDiv.innerHTML = `✅ ${dateTexte}`;
                    btn.style.display = "none";
                } else {
                    statusDiv.innerText = "⚠️ En attente de règlement";
                    btn.style.display = "block";
                }
            } else {
                const absMontant = Math.abs(totalVirement);
                box.style.backgroundColor = "#e65100";
                box.innerText = `Virement dû : Pauline doit ${absMontant.toFixed(2)} € à Nicolas`;
                if(estFait) {
                    statusDiv.innerHTML = `✅ ${dateTexte}`;
                    btn.style.display = "none";
                } else {
                    statusDiv.innerText = "⚠️ En attente de règlement";
                    btn.style.display = "block";
                }
            }
        }

        function marquerVirementFait() {
            const cibleMois = document.getElementById('filtreMois').value.trim();
            if (!confirm(`Clôturer les comptes de ${cibleMois} et marquer le virement comme effectué ?`)) return;

            const dateDuJour = new Date().toLocaleDateString('fr-FR').substr(0, 5);
            const chaineStatut = `Virement fait le ${dateDuJour}`;

            const lignesDuMois = localData.filter(item => item.date === cibleMois);
            
            let promesses = lignesDuMois.map(item => {
                const payload = {
                    action: "updateData",
                    id: item.id,
                    titre: item.titre,
                    montant: item.montant,
                    payeur: item.payeur,
                    date: item.date,
                    noSplit: item.nosplit,
                    statut: chaineStatut
                };
                return fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
            });

            document.getElementById('virementStatus').innerText = "Mise à jour de l'historique...";

            Promise.all(promesses)
            .then(() => {
                chargerDepenses();
            })
            .catch(err => {
                alert("Erreur lors de la validation globale.");
                console.error(err);
            });
        }

        function preparerEdition(id) {
            const item = localData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('formTitle').innerText = "Modifier la ligne";
            document.getElementById('editId').value = id;
            document.getElementById('titre').value = item.titre;
            document.getElementById('montant').value = item.montant;
            document.getElementById('dateMois').value = item.date;
            document.getElementById('payeur').value = item.payeur === "Pauline" ? "Pauline" : "Nicolas";
            document.getElementById('isFacture').checked = (item.nosplit === "Oui" || item.nosplit === "oui");

            document.getElementById('submitBtn').innerText = "Enregistrer les modifications";
            document.getElementById('cancelEditBtn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function supprimerDepense(id) {
            if (!confirm("Voulez-vous vraiment supprimer cette ligne ?")) return;
            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "deleteData", id: id }) })
            .then(() => chargerDepenses());
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = "Ajouter une ligne";
            document.getElementById('editId').value = "";
            document.getElementById('budgetForm').reset();
            document.getElementById('dateMois').value = document.getElementById('filtreMois').value;
            document.getElementById('submitBtn').innerText = "Enregistrer";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        window.onload = function() {
            // Initialisation
