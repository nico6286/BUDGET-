<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Couple</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --error-color: #cf6679;
            --border-color: #333333;
            --accent-orange: #ffb74d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 10px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Balance et Virement */
        .balance-box {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            background-color: #1a237e;
            border: 1px solid #303f9f;
            color: #fff;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .checkbox-group input {
            width: auto;
            transform: scale(1.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            color: #121212;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background-color: #9a67ea;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--secondary-color);
            color: var(--secondary-color);
            margin-top: 10px;
        }

        .btn-cancel {
            background-color: #333;
            color: #fff;
            margin-top: 8px;
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            min-height: 24px;
        }

        /* Liste des dépenses */
        .depense-item {
            border-bottom: 1px solid var(--border-color);
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .depense-item:last-child {
            border-bottom: none;
        }

        .depense-info {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .depense-titre {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .depense-meta {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }

        .badge-perso {
            background-color: #5d4037;
            color: #ffb74d;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 5px;
        }

        .depense-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .depense-montant {
            font-weight: bold;
            color: var(--secondary-color);
            font-size: 1.1rem;
        }

        .actions-links {
            font-size: 0.8rem;
        }

        .actions-links span {
            cursor: pointer;
            margin-left: 10px;
            text-decoration: underline;
        }

        .edit-link { color: var(--accent-orange); }
        .delete-link { color: var(--error-color); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Budget Couple</h1>
        
        <div id="balanceBox" class="balance-box">
            Calcul du virement en cours...
        </div>
        
        <div class="card">
            <h3 id="formTitle" style="margin-top:0; color: var(--secondary-color);">Ajouter une dépense</h3>
            <form id="budgetForm">
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="titre">Intitulé de la dépense</label>
                    <input type="text" id="titre" required placeholder="Ex: Essence, Courses Carrefour...">
                </div>
                
                <div class="form-group">
                    <label for="montant">Montant (€)</label>
                    <input type="number" id="montant" step="0.01" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="date">Date de la dépense</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="payeur">Qui a payé ?</label>
                    <select id="payeur" required>
                        <option value="Nicolas">Nicolas</option>
                        <option value="Pauline">Pauline</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="noSplit">
                    <label for="noSplit">Ne pas diviser (Dépense 100% perso)</label>
                </div>

                <button type="submit" id="submitBtn">Ajouter la dépense</button>
                <button type="button" id="cancelEditBtn" class="btn-cancel" style="display: none;" onclick="resetForm()">Annuler la modification</button>
            </form>
            <div id="statusMsg" class="status-msg"></div>
        </div>

        <h2>Dernières Dépenses</h2>
        <div class="card">
            <button class="btn-secondary" onclick="chargerDepenses()">Rafraîchir les données</button>
            <div id="listeDepenses" style="margin-top: 15px;">
                </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCvAPEDAe6UUfJDWF38NWWjP5bTMMRBAxgxPrjotUfvMH3xVRz2zpzXAVbsKDOUYkf/exec";

        let localData = [];

        const generateID = () => 'ID-' + Math.random().toString(36).substr(2, 9).toUpperCase();

        // Met la date du jour par défaut dans le calendrier
        function initDateInput() {
            const aujourdhui = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = aujourdhui;
        }

        function formaterDate(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return dateString;
            return d.toLocaleDateString('fr-FR');
        }

        // Convertit une date fr (JJ/MM/AAAA) ou ISO en format "AAAA-MM-JJ" pour l'input HTML
        function formaterPourInputDate(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) {
                const parts = dateString.split('/');
                if(parts.length === 3) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                return '';
            }
            return d.toISOString().split('T')[0];
        }

        document.getElementById('budgetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const msgDiv = document.getElementById('statusMsg');
            const editId = document.getElementById('editId').value;
            
            msgDiv.style.color = 'var(--secondary-color)';
            msgDiv.innerText = "Synchronisation avec Google Sheets...";

            // Récupère et formate la date sélectionnée en format FR (JJ/MM/AAAA)
            const dateSaisie = new Date(document.getElementById('date').value);
            const dateFormatee = dateSaisie.toLocaleDateString('fr-FR');

            const payload = {
                id: editId ? editId : generateID(),
                titre: document.getElementById('titre').value,
                montant: parseFloat(document.getElementById('montant').value),
                payeur: document.getElementById('payeur').value,
                date: dateFormatee, // Utilise la date choisie
                noSplit: document.getElementById('noSplit').checked ? "Oui" : "Non"
            };

            if (editId) {
                payload.action = "updateData";
            } else {
                payload.action = "addData";
                payload.statut = "En attente";
            }

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    msgDiv.innerText = editId ? "Dépense modifiée avec succès !" : "Dépense enregistrée !";
                    resetForm();
                    chargerDepenses();
                } else {
                    msgDiv.style.color = 'var(--error-color)';
                    msgDiv.innerText = "Erreur : " + data.error;
                }
            })
            .catch(error => {
                msgDiv.style.color = 'var(--error-color)';
                msgDiv.innerText = "Erreur réseau/CORS.";
                console.error(error);
            });
        });

        function chargerDepenses() {
            const liste = document.getElementById('listeDepenses');
            liste.innerHTML = "<p style='text-align:center; color:#888;'>Chargement...</p>";

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getData" })
            })
            .then(response => response.json())
            .then(res => {
                if(res.result === "success" && res.data.length > 0) {
                    
                    localData = res.data.map(item => {
                        const valeurs = Array.isArray(item) ? item : Object.values(item);
                        return {
                            id: valeurs[0] ? valeurs[0].toString() : "",
                            titre: valeurs[1] ? valeurs[1].toString() : "Sans titre",
                            montant: parseFloat(valeurs[2] || 0),
                            payeur: valeurs[3] ? valeurs[3].toString().trim() : "Inconnu",
                            date: valeurs[4] ? valeurs[4].toString() : "",
                            statut: valeurs[5] ? valeurs[5].toString() : "",
                            nosplit: valeurs[6] ? valeurs[6].toString().trim() : "Non"
                        };
                    });

                    liste.innerHTML = "";
                    
                    let totalNicolas = 0;
                    let totalPauline = 0;

                    localData.forEach(item => {
                        if (item.nosplit !== "Oui" && item.nosplit !== "oui") {
                            if (item.payeur === "Nicolas") totalNicolas += item.montant;
                            if (item.payeur === "Pauline") totalPauline += item.montant;
                        }
                    });

                    calculerVirement(totalNicolas, totalPauline);

                    // Tri des dépenses chronologiquement (par date) pour l'affichage de l'historique
                    const localDataTrie = [...localData].sort((a, b) => {
                        const parseDate = (str) => {
                            const p = str.split('/');
                            return p.length === 3 ? new Date(`${p[2]}-${p[1]}-${p[0]}`) : new Date(str);
                        };
                        return parseDate(b.date) - parseDate(a.date);
                    });

                    localDataTrie.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'depense-item';
                        div.innerHTML = `
                            <div class="depense-info">
                                <span class="depense-titre">
                                    ${item.titre} 
                                    ${(item.nosplit === "Oui" || item.nosplit === "oui") ? '<span class="badge-perso">Perso</span>' : ''}
                                </span>
                                <span class="depense-meta">${formaterDate(item.date)} • Payé par <strong>${item.payeur}</strong></span>
                            </div>
                            <div class="depense-right">
                                <span class="depense-montant">${item.montant.toFixed(2)} €</span>
                                <div class="actions-links">
                                    <span class="edit-link" onclick="preparerEdition('${item.id}')">Modifier</span>
                                    <span class="delete-link" onclick="supprimerDepense('${item.id}')">Suppr.</span>
                                </div>
                            </div>
                        `;
                        liste.appendChild(div);
                    });
                } else {
                    liste.innerHTML = "<p style='text-align:center; color:#888;'>Aucune dépense trouvée.</p>";
                    document.getElementById('balanceBox').innerText = "Aucune dépense partagée. Équilibre parfait !";
                }
            })
            .catch(error => {
                liste.innerHTML = "<p style='text-align:center; color:var(--error-color);'>Erreur de chargement.</p>";
                console.error(error);
            });
        }

        function calculerVirement(nicolasTotal, paulineTotal) {
            const box = document.getElementById('balanceBox');
            const diff = nicolasTotal - paulineTotal;
            
            if (diff === 0) {
                box.style.backgroundColor = "#1b5e20";
                box.innerText = "Équilibre parfait : Personne ne doit rien !";
            } else if (diff > 0) {
                const virement = diff / 2;
                box.style.backgroundColor = "#e65100";
                box.innerText = `Pauline doit faire un virement de ${virement.toFixed(2)} € à Nicolas`;
            } else {
                const virement = Math.abs(diff) / 2;
                box.style.backgroundColor = "#e65100";
                box.innerText = `Nicolas doit faire un virement de ${virement.toFixed(2)} € à Pauline`;
            }
        }

        function preparerEdition(id) {
            const item = localData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('formTitle').innerText = "Modifier la dépense";
            document.getElementById('editId').value = id;
            document.getElementById('titre').value = item.titre;
            document.getElementById('montant').value = item.montant;
            document.getElementById('date').value = formaterPourInputDate(item.date);
            document.getElementById('payeur').value = item.payeur === "Pauline" ? "Pauline" : "Nicolas";
            document.getElementById('noSplit').checked = (item.nosplit === "Oui" || item.nosplit === "oui");

            document.getElementById('submitBtn').innerText = "Enregistrer les modifications";
            document.getElementById('cancelEditBtn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function supprimerDepense(id) {
            if (!confirm("Voulez-vous vraiment supprimer cette dépense ?")) return;

            const msgDiv = document.getElementById('statusMsg');
            msgDiv.style.color = 'var(--accent-orange)';
            msgDiv.innerText = "Suppression dans le Sheet...";

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteData", id: id })
            })
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    msgDiv.style.color = 'var(--secondary-color)';
                    msgDiv.innerText = "Dépense supprimée !";
                    chargerDepenses();
                } else {
                    msgDiv.style.color = 'var(--error-color)';
                    msgDiv.innerText = "Erreur : " + data.error;
                }
            })
            .catch(error => {
                console.error(error);
            });
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = "Ajouter une dépense";
            document.getElementById('editId').value = "";
            document.getElementById('budgetForm').reset();
            initDateInput();
            document.getElementById('submitBtn').innerText = "Ajouter la dépense";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        window.onload = function() {
            initDateInput();
            chargerDepenses();
        };
    </script>
</body>
</html>
